# ===== Production (Render) - all secrets come from environment variables =====
# Uses the env var NAMES already configured on the Render service.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA Dialect =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Connection Pool =====
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ===== CORS - set to your deployed frontend URL via env var =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== JWT =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== PayPal (sandbox) - secrets from Render env vars =====
paypal.enabled=${PAYPAL_ENABLED:false}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.oauth-url=https://api-m.sandbox.paypal.com/v1/oauth2/token
paypal.create-order-url=https://api-m.sandbox.paypal.com/v2/checkout/orders
paypal.capture-order-url=https://api-m.sandbox.paypal.com/v2/checkout/orders/{orderId}/capture
paypal.currency=${PAYPAL_CURRENCY:USD}
paypal.frontend-return-base=${PAYPAL_FRONTEND_RETURN_BASE:https://freelancer-marketplace-app.onrender.com}
