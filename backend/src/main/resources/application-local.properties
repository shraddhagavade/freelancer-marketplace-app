# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/freelancer_marketplace
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:Gavade@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA Dialect =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Connection Pool =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:freelancerhub-secret-key-change-in-production-min-256-bits-long-enough}
app.jwt.expiration-ms=86400000

# ===== PayPal (sandbox) =====
# Credentials come from environment variables - never hardcode secrets.
paypal.enabled=${PAYPAL_ENABLED:true}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.oauth-url=https://api-m.sandbox.paypal.com/v1/oauth2/token
paypal.create-order-url=https://api-m.sandbox.paypal.com/v2/checkout/orders
paypal.capture-order-url=https://api-m.sandbox.paypal.com/v2/checkout/orders/{orderId}/capture
paypal.currency=USD
# Where PayPal redirects the buyer back to after approving/cancelling (frontend origin)
paypal.frontend-return-base=${PAYPAL_FRONTEND_RETURN_BASE:http://localhost:5173}
