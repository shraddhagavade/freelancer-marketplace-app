# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/freelancer_marketplace
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:Gavade@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA Dialect =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Connection Pool =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:freelancerhub-secret-key-change-in-production-min-256-bits-long-enough}
app.jwt.expiration-ms=86400000
