# ===== Application =====
spring.application.name=freelancer-marketplace
# Use Render's injected PORT if present, otherwise default to 8080 locally
server.port=${PORT:8080}
# Bind to all interfaces so the container is reachable
server.address=0.0.0.0

# ===== Active Profile (override with SPRING_PROFILES_ACTIVE env var on Render) =====
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===== Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
